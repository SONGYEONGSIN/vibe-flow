name: validation-tests

# F-G02 (audit round 7): 검증·계측 툴링을 머지 게이트로 승격.
# 동기: R6 F-F1 에서 validate.sh drift 블록이 3개 라운드 동안 silent 하게
# 무력화돼 있었음에도 CI 가 없어 발견이 늦었다. 이 워크플로우는
# validate.sh / sync-drift.sh / 계측 hook 의 회귀를 PR 단계에서 차단한다.
#
# 주의: core/ ↔ .claude/ 의 "라이브" drift 는 .claude/ 가 gitignored 라
# CI fresh clone 에서 검사 불가. 대신 fixture 기반 smoke 로 *검증 로직 자체*를
# 게이트한다 (F-G01 같은 비대칭 결함이 재발하면 즉시 fail).

on:
  # F-R02 (audit R17): pull_request 의 paths 필터를 제거한다. 두 가지 이유다.
  #  (1) required status check 을 걸려면 필수 — paths 로 걸러진 워크플로는 무관 PR 에서
  #      아예 발화하지 않고, GitHub 는 보고되지 않은 required check 을 영구 대기한다.
  #  (2) "게이트는 있고 트리거가 없다" 계보 종결 — F-K06(setup.sh) / F-L11(statusline.sh) /
  #      F-M08(check-doc-counts.sh) / F-Q05(.claude/evolution-protected) / F-Q20(ledger) 이
  #      전부 "경로를 하나 더 추가하는" fix 였고 5회 재발했다. 열거를 유지하는 한 6회차가
  #      예약된다. 전량 실행이 유지 비용 0 이고, 러너 시간(ubuntu 41s / windows 5m30s)은
  #      이 repo 의 PR 빈도에서 감당 가능하다.
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    # F-K13 (audit R11): 머지 게이트 플랫폼이 harness 실 운용 플랫폼(Windows git-bash)과
    # 분리돼 Windows 전용 회귀(jq CRLF, uuidgen 부재, 로케일 매칭)가 CI PASS 뒤에 숨었다.
    # windows-latest leg 를 추가해 양 플랫폼을 머지 게이트로 승격.
    strategy:
      fail-fast: false            # ubuntu 결과가 windows red 에 가려지지 않게
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash               # windows 기본 pwsh 대신 git-bash — 실 운용 환경과 동일
    steps:
      - name: Disable autocrlf (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        # checkout 전에 실행 — 라인엔딩 변환 노이즈가 아니라 스크립트 로직을 검증
      - uses: actions/checkout@v4
      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
        # windows-latest 는 jq 프리인스톨 (러너 이미지 포함)
      - name: Run fixture-based validation & instrumentation smoke tests
        run: |
          set -u
          failed=0
          executed=0
          # F-H05 (audit R8): CI-SKIP 마커(.claude 런타임/gh 등 CI 부재 의존) 테스트만 제외,
          # 나머지는 전부 RUN. 기존 mktemp 휴리스틱은 core-only CI-safe 테스트
          # (persona-vote/notify-pr)를 false-skip 하던 결함 → 명시 마커 방식으로 전환.
          for t in scripts/tests/*.sh; do
            if grep -q 'CI-SKIP' "$t"; then
              echo "SKIP (CI-SKIP marker)  $(basename "$t")"
              continue
            fi
            executed=$((executed+1))
            echo "::group::$t"
            if bash "$t"; then
              echo "PASS  $(basename "$t")"
            else
              echo "FAIL  $(basename "$t")"
              failed=1
            fi
            echo "::endgroup::"
          done
          # F-L10 (audit R12) + F-M09 (audit R13): 플로어 하한(-lt)은 삭제만 잡고 추가를
          # 강제하지 않아 첫 스모크 추가에서 1-slack 으로 열화(zero-headroom 정체).
          # 등가(-ne) 대조로 전환 — 스모크 증감 시 이 기대치를 같은 PR 에서 갱신한다.
          EXPECTED_SMOKE=44
          echo "executed smoke tests: $executed (expected $EXPECTED_SMOKE)"
          if [ "$executed" -ne "$EXPECTED_SMOKE" ]; then
            echo "::error::실행된 스모크 $executed ≠ 기대치 $EXPECTED_SMOKE — 커버리지 소실 또는 기대치 미갱신"
            failed=1
          fi
          exit $failed

  # F-R03 (audit R17): push→main 실패의 harness 소비자가 0 이라, #180 이 만든 RED 가
  # 10일간 아무에게도 도달하지 않았다. 실패를 사람·자율루프 양쪽이 읽는 자료구조(issue)로
  # 승격한다. PR leg 에는 걸지 않는다 — PR 은 체크 UI 가 이미 소비자다.
  notify-red:
    needs: smoke
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: main RED → issue 승격
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          gh label create ci-red --color B60205 --description "main CI RED" --repo "$REPO" 2>/dev/null || true
          # 중복 폭주 방지 — 열린 ci-red 이슈가 있으면 코멘트도 새 이슈도 만들지 않는다
          open=$(gh issue list --repo "$REPO" --label ci-red --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "이미 열린 ci-red 이슈 $open 건 — 중복 생성 생략"
            exit 0
          fi
          gh issue create --repo "$REPO" --label ci-red \
            --title "main RED: validation-tests ($(echo "$SHA" | cut -c1-7))" \
            --body "$(printf 'main 의 validation-tests 가 실패했다.\n\n- commit: %s\n- run: %s\n\n복구 전까지 머지를 멈춘다. 원인 재현: `for t in scripts/tests/*.sh; do bash "$t"; done`\n\n> 이 이슈는 워크플로가 자동 생성했다(F-R03). 복구 후 닫으면 다음 RED 에서 다시 열린다.' "$SHA" "$RUN_URL")"
